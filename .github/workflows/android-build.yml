name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.27.0'
  JAVA_VERSION: '17'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bootstrap Android platform files when absent
        shell: bash
        run: |
          if [[ ! -f android/settings.gradle && ! -f android/settings.gradle.kts ]]; then
            flutter create --platforms=android --org com.productchat.studio .
          fi

      - name: Align Android Gradle Plugin with androidx.webkit
        shell: bash
        run: |
          for file in android/settings.gradle android/settings.gradle.kts; do
            if [[ -f "$file" ]]; then
              sed -i 's/com.android.application" version "8\.1\.0"/com.android.application" version "8.1.1"/g' "$file"
              sed -i "s/com.android.application' version '8\.1\.0'/com.android.application' version '8.1.1'/g" "$file"
            fi
          done
          for file in android/app/build.gradle android/app/build.gradle.kts; do
            if [[ -f "$file" ]]; then
              sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 23/g' "$file"
              sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/g' "$file"
            fi
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  debug-build:
    name: Build debug APK and AAB
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bootstrap Android platform files when absent
        shell: bash
        run: |
          if [[ ! -f android/settings.gradle && ! -f android/settings.gradle.kts ]]; then
            flutter create --platforms=android --org com.productchat.studio .
          fi

      - name: Align Android Gradle Plugin with androidx.webkit
        shell: bash
        run: |
          for file in android/settings.gradle android/settings.gradle.kts; do
            if [[ -f "$file" ]]; then
              sed -i 's/com.android.application" version "8\.1\.0"/com.android.application" version "8.1.1"/g' "$file"
              sed -i "s/com.android.application' version '8\.1\.0'/com.android.application' version '8.1.1'/g" "$file"
            fi
          done
          for file in android/app/build.gradle android/app/build.gradle.kts; do
            if [[ -f "$file" ]]; then
              sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 23/g' "$file"
              sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/g' "$file"
            fi
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build debug AAB
        run: flutter build appbundle --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nabd-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: nabd-debug-aab
          path: build/app/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
